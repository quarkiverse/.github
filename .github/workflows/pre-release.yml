name: Quarkiverse Pre Release

on:
  workflow_call:
    inputs:
      maven_executable:
        required: false
        description: Maven Executable
        type: string
      java_version:
        required: false
        description: Java Version
        type: number
        default: 17

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: pre release

    steps:
      - name: Check if PR is from a fork
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::Pre-release cannot be triggered from a fork.'
          exit 1

      - uses: actions/checkout@v7

      - uses: smallrye/project-metadata-action@main
        name: retrieve project metadata
        id: metadata
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          metadata-file-path: '.github/project.yml'
          local-file: true

      - name: Validate version
        if: contains(steps.metadata.outputs.current-version, 'SNAPSHOT')
        run: |
          echo '::error::Cannot release a SNAPSHOT version.'
          exit 1
      - name: Check if there are any pre-release error messages
        if: ${{ vars.PRE_RELEASE_ERROR != ''}}
        run: |
          echo '::error::${{ vars.PRE_RELEASE_ERROR }}'
          exit 1

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: 'maven'

      - name: Detect Maven Executable
        run: |
          if [[ -z "${MAVEN_EXEC}" ]]; then
            if [ -f mvnw ]; then
              echo "MAVEN_EXEC=./mvnw" >> $GITHUB_ENV
            else
              echo "MAVEN_EXEC=mvn" >> $GITHUB_ENV
            fi
          else
            echo "MAVEN_EXEC=${MAVEN_EXEC}" >> $GITHUB_ENV
          fi
        env:
          MAVEN_EXEC: ${{ inputs.maven_executable }}

      - name: Build project
        run: $MAVEN_EXEC -B -ntp package -DskipTests -DskipITs

      - name: Check for untracked files
        run: |
          UNTRACKED=$(git status --porcelain --untracked-files=all)
          if [[ -n "${UNTRACKED}" ]]; then
            echo '::error::The build produced untracked or modified files. Add them to .gitignore (or commit them) to avoid a failing release.'
            echo "${UNTRACKED}"
            git status --porcelain --untracked-files=all >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
